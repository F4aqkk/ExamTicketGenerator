# Документация на сайте GitHub Pages (GitHub Actions).
# При каждом Pull Request документация только собирается — так видно,
# что сборка не сломана. При отправке кода в main собранные страницы
# выкладываются на сайт https://f4aqkk.github.io/ExamTicketGenerator/

name: Документация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка Sphinx
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код из репозитория
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить системные библиотеки для PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Поставить библиотеки проекта и Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r docs/requirements.txt

      - name: Собрать документацию
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m sphinx -b html docs docs/_build/html

      - name: Передать страницы для сайта
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Выложить на GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
